<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accent)" stroke-width="16" opacity="0.3" />
  <!-- Sparkle / Brain Star Shape -->
  <path d="M256 96 C256 180 180 256 96 256 C180 256 256 332 256 416 C256 332 332 256 416 256 C332 256 256 180 256 96 Z" fill="url(#accent)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="32" fill="#ffffff" opacity="0.9" />
</svg>
